<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bazar Admin Panel</title>

  <!-- Crisp-modern type: Manrope (UI/display) + Spectral (editorial display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Spectral:ital,wght@0,500;0,600;1,600&display=swap" rel="stylesheet" />

  <!-- No-flash theme bootstrap: apply persisted theme/accent/style/dark
       attributes onto <html> before the app (and its CSS) paints. -->
  <script>
    (function () {
      try {
        var DARK = { dark: 1, midnight: 1, forest: 1 };
        var theme  = localStorage.getItem('bz-theme-id');
        if (!theme) {
          var legacy = localStorage.getItem('bz-theme');
          theme = (legacy === 'dark' || legacy === 'light') ? legacy : 'light';
        }
        try { theme = JSON.parse(theme); } catch (e) {}
        var accent = localStorage.getItem('bz-accent');
        try { accent = JSON.parse(accent); } catch (e) {}
        var style  = localStorage.getItem('bz-style');
        try { style = JSON.parse(style); } catch (e) {}
        var el = document.documentElement;
        el.setAttribute('data-theme', theme || 'light');
        el.setAttribute('data-accent', accent || 'cobalt');
        el.setAttribute('data-style', style || 'modern');
        if (DARK[theme]) el.setAttribute('data-dark', '1');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
